[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devgenie"
version = "0.1.0"
description = "All-in-one AI developer assistant powered by local LLMs via Ollama"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
devgenie = "devgenie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
